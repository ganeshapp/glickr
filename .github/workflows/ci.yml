name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK glickr is developed and released with. Not
          # `stable`: hive_generator and riverpod_generator cannot co-resolve on
          # newer SDKs, because the _macros package they transitively need was
          # removed, so an SDK bump breaks codegen rather than the app.
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Catches the class of failure that only shows up at assemble time:
      # a plugin raising the required AGP, compileSdk, or NDK version.
      - name: Build APK
        run: flutter build apk --debug

  # Desktop builds can't run on the dev Mac (no Xcode), so this is where pods,
  # the 10.15 deployment target, -Werror C++ in the Linux plugins and linking
  # libsecret/GTK get checked. Debug is enough for that; it builds the
  # committed .g.dart files as they are (the test job regenerates its own).
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux }
          - { os: macos-15, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      # The same release build and packaging the release workflow runs, so a
      # broken .deb/.dmg shows up on the PR instead of after tagging.
      - run: flutter build ${{ matrix.target }} --release
      - run: tool/package_desktop.sh ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y ./build/dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: build/dist/*
